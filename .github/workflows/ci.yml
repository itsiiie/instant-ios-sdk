name: CI

on:
  push:
    branches:
      - ci-basic-github-actions
      - main
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        # Pins the version for consistent, reproducible builds
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache Swift Package Manager
        # Speeds up subsequent runs by caching the .build directory
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build SDK
        # Builds the main library target
        run: swift build -v

      - name: Run Tests
        # Executes InstantDBTests and InstantDBMacrosTests in parallel
        run: swift test -v --parallel

      - name: Lint Check
        # Runs the project's existing lint script if it exists
        run: |
          if [ -f "scripts/swiftlint.sh" ]; then
            bash scripts/swiftlint.sh
          fi
