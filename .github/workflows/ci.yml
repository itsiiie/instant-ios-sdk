name: CI

on:
  push:
    branches:
      - ci-basic-github-actions
      - main
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}

      - name: Build SDK
        run: swift build -v

      - name: Run InstantDB runtime tests only
        run: |
          swift test \
            --skip-build \
            --filter '^InstantDBTests\.' \
            --disable-test-discovery \
            -v
