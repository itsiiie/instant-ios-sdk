name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Swift package
        run: swift build -v

      - name: Run runtime tests
        run: swift test --filter InstantDBTests -v
