name: CI

on:
  push:
    branches: [main, ci-basic-github-actions, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (Xcode ${{ matrix.xcode }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        xcode: ["15.2", "15.4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Show Swift version
        run: swift --version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ matrix.xcode }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.xcode }}-
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v --enable-code-coverage

      - name: Generate code coverage report
        if: matrix.xcode == '15.4'
        run: |
          xcrun llvm-cov export -format="lcov" \
            .build/debug/instant-ios-sdkPackageTests.xctest/Contents/MacOS/instant-ios-sdkPackageTests \
            -instr-profile .build/debug/codecov/default.profdata > coverage.lcov || echo "Coverage export failed"
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.xcode == '15.4'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.lcov
          fail_ci_if_error: false
        continue-on-error: true

  validate-package:
    name: Validate Swift Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package
        run: swift package diagnose

      - name: Show package dependencies
        run: swift package show-dependencies

  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
        continue-on-error: true
