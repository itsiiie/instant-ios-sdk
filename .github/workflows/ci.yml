name: CI

on:
  push:
    branches:
      - ci-basic-github-actions
      - main
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14 # Specifically use macOS 14 for Xcode 15+ support

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 #

      - name: Select Xcode Version
        # Pinning to 15.4 for consistency as suggested in review
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache Swift Package Manager
        # Added caching for faster build times
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build SDK
        # Uses the repository's build script to verify platform compatibility
        # Targets iOS by default as a baseline check
        run: bash scripts/build.sh InstantDB iOS

      - name: Run Tests
        # Executes InstantDBTests and InstantDBMacrosTests
        run: swift test -v --parallel

      - name: Verify CLI Tools
        # Ensures the schema generation tools remain functional
        run: |
          swift build --product instant-schema
          swift build --product InstantSchemaGenerator

      - name: Lint Check
        # Integrates existing project linting if the script is present
        run: |
          if [ -f "scripts/swiftlint.sh" ]; then
            bash scripts/swiftlint.sh
          fi
