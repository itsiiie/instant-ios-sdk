name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Lint and Format Check
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          if [ -f "scripts/swiftlint.sh" ]; then
            bash scripts/swiftlint.sh
          else
            swiftlint
          fi
      - name: SwiftFormat Check
        run: |
          if [ -f "scripts/swiftformat.sh" ]; then
            bash scripts/swiftformat.sh --lint
          fi

  # 2. Build for all platforms (iOS, macOS, etc.)
  build-platforms:
    runs-on: macos-14
    strategy:
      matrix:
        platform: [iOS, macOS, tvOS, watchOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build for ${{ matrix.platform }}
        run: bash scripts/build.sh InstantDB ${{ matrix.platform }}

  # 3. Run Unit and Macro Tests
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: swift test --parallel

  # 4. Build CLI Tool and Plugins
  build-tools:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build instant-schema CLI
        run: swift build --product instant-schema
      - name: Build InstantSchemaGenerator
        run: swift build --product InstantSchemaGenerator
