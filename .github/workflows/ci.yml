name: CI

on:
  push:
    branches:
      - ci-basic-github-actions
      - main
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build SDK
        run: swift build -v

      - name: Run InstantDB runtime tests only
        run: swift test --skip-build --filter InstantDBTests. -v

      - name: Lint Check
        run: |
          if [ -f "scripts/swiftlint.sh" ]; then
            bash scripts/swiftlint.sh
          fi
